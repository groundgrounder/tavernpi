# 作品级元数据（创作规划 §4.1）。
title: 守陵人
calendar: 大雍历        # 历法：大雍历（§5.3）
granularity: elastic   # 时间粒度：elastic（弹性时间）
opening: |
  你受旧友之托，连夜赶赴大雍王陵。暮色四合，你踏上守陵石阶，见陵门半掩，门缝里漏出一线烛火。
  守陵人沈秋提着铜灯立在门内，灯影将他的脸照得明暗不定。他说：「陵里出事了，镇魂的铜钉少了一枚，
  石棺上的封蜡也裂了。」他顿了顿，把一串铜钥交到你手里：「今夜，你替我守住这道门。」
  山风卷过松林，远处传来一声低沉的磬响。你握紧铜钥，踏进半掩的陵门，身后的月光随即被黑暗吞没。
defaultStyle: 简洁克制的古典志怪笔法，环境与感官细节点到即止，对白多用短句，不堆砌形容词。
